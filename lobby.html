<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skintania — Room Lobby</title>
  <link rel="icon" href="/sk-cu.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
</head>
<body>
  <div id="toast"></div>

  <div class="view active" id="view-room">

    <!-- Room header: code + game badge + copy -->
    <div class="rm-header glass">
      <div>
        <div class="rm-code-label">Room Code</div>
        <div class="rm-code" id="rm-code">——</div>
      </div>
      <div class="rm-header-right">
        <span class="phase-badge" id="rm-game-badge">—</span>
        <button class="btn btn-ghost" id="rm-copy-btn" style="width:auto;padding:7px 14px;font-size:12px">Copy Code</button>
      </div>
    </div>

    <!-- Table counts row -->
    <div class="rm-counts">
      <div class="rm-count-box glass">
        <span class="rm-count-val" id="rm-player-count">—</span>
        <span class="rm-count-lbl">at table</span>
      </div>
      <span class="rm-count-sep">/</span>
      <div class="rm-count-box glass">
        <span class="rm-count-val" id="rm-max-display">—</span>
        <span class="rm-count-lbl">max</span>
      </div>
      <div class="rm-count-box glass rm-count-spec">
        <span class="rm-count-val" id="rm-spec-count">—</span>
        <span class="rm-count-lbl">watching</span>
      </div>
    </div>

    <!-- Player list (from game state) -->
    <div class="rm-player-list glass" id="rm-player-list">
      <div class="rm-list-title">At the Table</div>
      <div id="rm-players-inner">
        <div class="rm-empty">No players at the table yet</div>
      </div>
    </div>

    <!-- Your role badge -->
    <div class="rm-role-row">
      <div class="rm-role-badge rm-role-spectator" id="rm-role-badge">👁 Spectating</div>
    </div>

    <!-- Primary action buttons -->
    <div class="rm-actions">
      <button class="btn btn-pink"    id="btn-join-table"  style="display:none">Join Table</button>
      <button class="btn btn-ghost"   id="btn-leave-table" style="display:none">Leave Table</button>
      <button class="btn btn-primary" id="btn-start-round" style="display:none" disabled>Waiting for players…</button>
    </div>

    <!-- Secondary: leave room -->
    <button class="btn btn-ghost" id="btn-leave-room" style="width:auto;padding:10px 24px;font-size:13px;color:var(--muted)">Leave Room</button>

    <!-- Host settings (waiting status only) -->
    <div id="rm-settings" class="rm-settings glass" style="display:none">
      <div class="host-settings-title">Room Settings</div>
      <div class="host-setting-row">
        <span class="host-setting-lbl">Max Players</span>
        <div class="host-stepper">
          <button class="btn btn-ghost stepper-btn" id="rm-max-minus">−</button>
          <span id="rm-max-val">8</span>
          <button class="btn btn-ghost stepper-btn" id="rm-max-plus">+</button>
        </div>
      </div>
      <div class="host-setting-row" id="rm-chips-row" style="display:none">
        <span class="host-setting-lbl">Starting Chips</span>
        <input type="number" id="rm-chips" class="bet-field" value="1000" min="100" max="1000000" style="width:110px;text-align:right">
      </div>
      <div class="host-setting-row" id="rm-timer-row" style="display:none">
        <span class="host-setting-lbl">Turn Limit (s, 0=off)</span>
        <input type="number" id="rm-timer" class="bet-field" value="0" min="0" max="300" style="width:80px;text-align:right">
      </div>
      <div class="host-setting-row" id="rm-rounds-row" style="display:none">
        <span class="host-setting-lbl">Round Limit (0=∞)</span>
        <input type="number" id="rm-rounds" class="bet-field" value="0" min="0" max="1000" style="width:80px;text-align:right">
      </div>
    </div>

  </div>

  <script type="module" src="/src/pages/lobby.js"></script>
</body>
</html>
