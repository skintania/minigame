<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skintania Games</title>
  <link rel="icon" href="/sk-cu.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
</head>
<body>
  <div id="toast"></div>

  <div class="view active" id="view-login">
    <div class="login-card glass">
      <img src="/sk-cu.png" class="logo" alt="Skintania">
      <div class="brand">Skintania</div>
      <div class="brand-sub">Multiplayer Minigames</div>

      <div id="config-row">
        <div class="field-wrap">
          <label class="label" for="worker-url">Worker URL</label>
          <input type="text" id="worker-url" class="input-field" placeholder="https://your-worker.workers.dev">
        </div>
      </div>

      <div class="field-wrap">
        <label class="label" for="username-input">Username</label>
        <input type="text" id="username-input" class="input-field" placeholder="Enter your username" maxlength="24" autocomplete="off">
      </div>

      <button class="btn btn-primary" id="login-btn">Enter the Arena</button>
      <span class="config-link" id="config-link">⚙ Configure API URL</span>
    </div>
  </div>

  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
